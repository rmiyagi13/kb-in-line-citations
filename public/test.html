<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            text-align: center;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 80%;
        }
        h1 {
            color: #0366d6;
        }
        p {
            color: #586069;
            margin-bottom: 20px;
        }
        button {
            background-color: #2ea44f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #2c974b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GitHub Pages is Working!</h1>
        <p>If you can see this page, your GitHub Pages deployment is successful.</p>
        <p>This is a simple test page to verify that basic hosting is functioning.</p>
        <button id="testButton">Click Me</button>
        <p id="result"></p>
    </div>

    <script>
        document.getElementById('testButton').addEventListener('click', function() {
            document.getElementById('result').textContent = 'JavaScript is working too! Clicked at: ' + new Date().toLocaleTimeString();
        });
    </script>
</body>
</html>
